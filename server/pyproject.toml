[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aethos-memory"
version = "0.1.0"
description = "A portable memory layer for AI tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0",
    "supabase>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
aethos-memory = "aethos_memory.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aethos_memory"]
